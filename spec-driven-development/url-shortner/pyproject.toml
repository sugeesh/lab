[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "shortener"
version = "0.1.0"
description = "URL shortener with expiry, enable/disable and daily click counts"
requires-python = ">=3.12"
dependencies = [
    "fastapi",
    "uvicorn",
    "jinja2",
    "python-multipart",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "httpx",
    "ruff",
    "pytest-playwright",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
shortener = ["schema.sql", "templates/*.html", "static/*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
markers = [
    "perf: slow 1M-link latency test",
    "browser: runs app.js in headless Chromium",
]
addopts = "-m 'not perf' --browser chromium"
