{% extends "base.html" %}
{% block title %}Create account{% endblock %}
{% block content %}
<h1>Create an account</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/account/signup" class="form">
  <input type="hidden" name="time_zone" value="">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required value="{{ email or '' }}">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="new-password"
         minlength="8" required aria-describedby="password-hint">
  <p id="password-hint" class="hint">At least 8 characters.</p>
  <button type="submit">Create account</button>
</form>
<p>Already have an account? <a href="/account/signin">Sign in</a></p>
{% endblock %}
