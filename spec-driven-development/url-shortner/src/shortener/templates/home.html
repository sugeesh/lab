{% extends "base.html" %}
{% block title %}Shorten a link{% endblock %}
{% block content %}
<h1>Shorten a link</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/links" class="form">
  <label for="url">Long web address</label>
  <input id="url" name="url" type="url" required autofocus
         value="{{ url or '' }}" aria-describedby="url-hint">
  <p id="url-hint" class="hint">Starts with http:// or https://</p>
  <button type="submit">Shorten</button>
</form>
{% endblock %}
