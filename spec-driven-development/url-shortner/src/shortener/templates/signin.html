{% extends "base.html" %}
{% block title %}Sign in{% endblock %}
{% block content %}
<h1>Sign in</h1>
{% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
<form method="post" action="/account/signin" class="form">
  <input type="hidden" name="time_zone" value="">
  <input type="hidden" name="next" value="{{ next or '/' }}">
  <label for="email">Email</label>
  <input id="email" name="email" type="email" autocomplete="email" required value="{{ email or '' }}">
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <button type="submit">Sign in</button>
</form>
<p>No account yet? <a href="/account/signup">Create one</a></p>
{% endblock %}
